name: Tests
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ruby: '3.1', grape: '~> 2.4', representable: '~> 3.2.0' }
          - { ruby: '3.3', grape: '~> 2.4', representable: '~> 3.3' }
          - { ruby: '3.3', grape: '~> 3.0', representable: '~> 3.3' }
          - { ruby: '3.4', grape: '~> 4.0', representable: '~> 3.3' }
          - { ruby: '4.0', grape: '~> 4.0', representable: '~> 3.3' }
    name: Ruby ${{ matrix.ruby }} / Grape ${{ matrix.grape }}
    env:
      GRAPE_VERSION: ${{ matrix.grape }}
      REPRESENTABLE_VERSION: ${{ matrix.representable }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake spec
      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/lcov.info
          format: lcov
          flag-name: ruby-${{ matrix.ruby }}-grape-${{ strategy.job-index }}
          parallel: true
  finish:
    name: Finish Coveralls
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
